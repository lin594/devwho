name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install check tools
        run: python -m pip install . build ruff
      - name: Format and lint
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts
      - name: Test real Bash and Zsh
        env:
          PYTHONPATH: src
          DEVWHO_TEST_BASH: /bin/bash
          DEVWHO_TEST_ZSH: /bin/zsh
        run: python -m unittest discover -s tests -v
      - name: Build and inspect distributions
        run: |
          python -m build
          python scripts/build_zipapp.py
          python dist/devwho-0.1.0.pyz --version
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          devwho --version
      - name: Verify distribution checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: devwho-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/
